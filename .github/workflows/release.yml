name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package plugin
        shell: bash
        run: |
          mkdir -p release
          cp -R plugin/autoUploadLongMessages release/autoUploadLongMessages
          cd release
          zip -r ../autoUploadLongMessages.zip autoUploadLongMessages

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          scripts/Install.bat
          autoUploadLongMessages.zip
          scripts/Install.ps1
          --title "AutoUploadLongMessages ${GITHUB_REF_NAME}"
          --generate-notes
